<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Dayana Melisa 💐</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            /* Imagen de fondo */
            background-image: url("../Img/Fondo.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: flex-end;

            overflow: hidden;
        }

        /* Oscurece ligeramente la imagen */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            z-index: 0;
        }

        .contenedor {
            position: relative;
            z-index: 1;

            width: 100%;
            display: flex;
            justify-content: center;

            padding: 0 20px;
            padding-bottom: max(35px, env(safe-area-inset-bottom));
        }

        .boton {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 180px;
            padding: 15px 30px;

            background: linear-gradient(
                135deg,
                #ff69b4,
                #ff1493
            );

            color: white;
            text-decoration: none;

            font-family: Arial, sans-serif;
            font-size: clamp(16px, 4vw, 20px);
            font-weight: bold;

            border-radius: 50px;

            box-shadow:
                0 6px 20px rgba(255, 20, 147, 0.45);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .boton:hover {
            transform: scale(1.08);

            box-shadow:
                0 8px 25px rgba(255, 20, 147, 0.65);
        }

        .boton:active {
            transform: scale(0.95);
        }

        /* Ajustes para celulares */
        @media (max-width: 600px) {
            .contenedor {
                padding-left: 15px;
                padding-right: 15px;
                padding-bottom: max(25px, env(safe-area-inset-bottom));
            }

            .boton {
                width: 80%;
                max-width: 280px;
                padding: 14px 20px;
            }
        }

        /* Pantallas muy pequeñas */
        @media (max-height: 500px) {
            .contenedor {
                padding-bottom: 15px;
            }

            .boton {
                padding: 10px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <a
            href="../Dedicatoria/Dedicatoria.html"
            class="boton"
        >
            Siguiente 💖
        </a>
    </div>

</body>
</html>
